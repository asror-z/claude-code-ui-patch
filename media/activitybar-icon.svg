<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
  <!-- Three sliders, matching the marketplace icon.png's settings badge — the
       Activity Bar recolors this SVG per-theme, so it must stay a single flat
       shape (currentColor), unlike icon.png's full-color spark+badge design. -->
  <line x1="4" y1="7" x2="20" y2="7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="15" cy="7" r="2.3" fill="currentColor"/>

  <line x1="4" y1="12" x2="20" y2="12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="9" cy="12" r="2.3" fill="currentColor"/>

  <line x1="4" y1="17" x2="20" y2="17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="17" cy="17" r="2.3" fill="currentColor"/>
</svg>
